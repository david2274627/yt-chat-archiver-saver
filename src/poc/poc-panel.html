<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <title>PoC 測試面板</title>
  <style>
    html, body { margin: 0; height: 100%; }
    body { display: flex; flex-direction: column; box-sizing: border-box; background: #fff4e6; color: #1b1f2a;
      font: 13px/1.45 "Noto Sans TC", "Microsoft JhengHei", system-ui, sans-serif; }
    .title { padding: 8px 10px; font-weight: 700; border-bottom: 1px solid #e8590c55; }
    .list { flex: 1; overflow-y: auto; padding: 6px 10px; }
    button { display: block; width: 100%; text-align: left; margin: 2px 0; padding: 6px 8px; border: 1px solid #e8590c44;
      border-radius: 6px; background: transparent; color: inherit; cursor: pointer; font: inherit; }
    button:hover { background: #e8590c22; }
    button.hit { background: #0ca67833; border-color: #0ca678; }
  </style>
</head>
<body>
  <div class="title">測試面板（擴充功能 iframe，橘色）</div>
  <div class="list" id="list"></div>
  <script src="poc-panel.js"></script>
</body>
</html>
